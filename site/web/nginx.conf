server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;

  # HTML, site.js e imagens sem hash: revalidar sempre (304 barato). Fica no nível do server porque
  # add_header dentro de location anula os de cima (CSP inclusive); /_astro e /media têm o próprio.
  add_header Cache-Control "no-cache" always;
  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;
  # api.github.com: o site.js confere se saiu release nova depois do deploy
  add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; media-src 'self'; connect-src 'self' https://api.github.com; frame-ancestors 'none'; base-uri 'self'" always;

  location = /healthz { access_log off; return 200 "ok"; }

  # assets do Astro têm hash no nome
  location /_astro/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    add_header X-Content-Type-Options nosniff always;
    try_files $uri =404;
  }
  location /media/ {
    # o mime.types do nginx não conhece .vtt; com nosniff, a legenda sem text/vtt é recusada
    types { video/mp4 mp4; video/webm webm; text/vtt vtt; }
    add_header Cache-Control "public, max-age=604800";
    add_header X-Content-Type-Options nosniff always;
    try_files $uri =404;
  }
  location / { try_files $uri $uri/ =404; }
}
