server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;

  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;
  # api.github.com: o site.js confere se saiu release nova depois do deploy
  add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; media-src 'self'; connect-src 'self' https://api.github.com; frame-ancestors 'none'; base-uri 'self'" always;

  location = /healthz { access_log off; return 200 "ok"; }

  # assets do Astro têm hash no nome
  location /_astro/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    add_header X-Content-Type-Options nosniff always;
    try_files $uri =404;
  }
  location /media/ {
    add_header Cache-Control "public, max-age=604800";
    add_header X-Content-Type-Options nosniff always;
    try_files $uri =404;
  }
  location / { try_files $uri $uri/ =404; }
}
