appId: com.fariasbrz.arcanshot
productName: ArcanShot
directories:
  output: release
  buildResources: resources
files:
  - out/**
  - resources/icon.png
asar: true
win:
  target:
    - target: nsis
      arch: [x64]
  icon: resources/icon.png
nsis:
  oneClick: true
  perMachine: false
  artifactName: ArcanShot-Setup-${version}.exe
  shortcutName: ArcanShot
  deleteAppDataOnUninstall: false
# Auto-update (electron-updater): gera app-update.yml no app e latest.yml no build.
# O upload para a Release é feito pelo workflow (electron-builder roda com --publish never).
publish:
  provider: github
  owner: imfarias
  repo: arcanshot
